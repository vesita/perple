[package]
name = "perple"
version = "1.0.0"
edition = "2024"

[dependencies]
rand = "0.10.1"
ort = "=2.0.0-rc.10"
image = { version = "0.25" }
ndarray = { version = "0.17", features = ["rayon"] }
pcd-rs = "0.13.0"
nalgebra = { version = "0.34", features = ["std"] }
toml = "1.1"
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.52.1", features = ["full"] }
redra_client = { git = "https://github.com/vesita/redra" }
expto = { git = "https://github.com/vesita/redra" }
log = "0.4"
env_logger = "0.11"
# 卡尔曼滤波库 (本地路径)
adskalman = { path = "crates/adskalman-rs" }
transitioner = { path = "crates/transitioner" }
approx = "0.5"
# ROS1 桥接
rosrust = { version = "0.9", optional = true }
byteorder = "1.5"
serde_json = "1.0.149"
rusqlite = { version = "0.32", features = ["bundled"] }

[features]
ros1 = ["rosrust"]
