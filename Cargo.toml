[package]
name = "perple"
version = "0.2.0"
edition = "2024"

[dependencies]
rand = "0.10.1"
ort = "=2.0.0-rc.10"
image = { version = "0.25" }
ndarray = { version = "0.17", features = ["rayon"] }
raqote = "0.8"
pcd-rs = "0.13.0"
nalgebra = { version = "0.34", features = ["std"] }
toml = "1.1"
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.52.1", features = ["full"] }
redra_client = { path = "../redra/crates/redra_client" }
expto = { path = "../redra/crates/expto" }
log = "0.4"
env_logger = "0.11"
ndarray-linalg = { version = "0.18", features = ["openblas-system"] }
# 卡尔曼滤波库 (本地路径)
adskalman = { path = "crates/adskalman-rs" }
approx = "0.5"