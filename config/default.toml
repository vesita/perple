stream_capacity = 1024
detections_capacity = 16
person_class_label = "person"
points_capacity = 16384
resolution = 0.07

# 目标检测超参数配置
default_input_width = 640
default_input_height = 640
default_confidence_threshold = 0.6
default_nms_threshold = 0.7

# 模型路径
model_path = "module/color/yolo11n.onnx"

# DBSCAN聚类算法参数
dbscan_min_points = 3
# dbscan_eps会基于resolution动态计算，值为resolution * 4.0

# 地面检测参数（直方图种子 + RANSAC 平面拟合生长）
ground_expand = 0.20
ground_ransac_distance = 0.3
ground_ransac_iterations = 50
upside_down = true
has_ceiling = false

# 点云聚类参数
[claster]
# 聚类策略: "dbscan", "dbscan_adaptive", "range_image"
strategy = "dbscan_adaptive"
merge_patience = 0.15
merge_threshold = 0.6
voxel_size = 0.1
min_points_per_cluster = 8
eps_slope = 0.03
max_points_per_node = 50
max_tree_depth = 10
use_parallel = true
# 下采样方法: "voxel" 或 "gaussian"
downsample_method = "gaussian"
# Gaussian 概率下采样参数（仅 downsample_method="gaussian" 时有效）
gaussian_downsample_rate = 6.0
# 聚类输入最大距离（超过此距离的非地面点被剔除，0=不限制）
max_range = 12.0
# 室内天花板过滤（剔除天花板上方杂点，减少无效簇）
ceiling_filter = true
ceiling_height = 2.5
# 密度感知质心加权（0=禁用，1=1/r补偿，2=1/r²补偿）
density_weight_alpha = 1.0
# PCA 定向包围盒（true=开启，false=使用 AABB）
use_pca_obb = true

# Range image 参数
azimuth_resolution = 2.0
elevation_resolution = 2.0
cluster_threshold = 1.0

[tracker]
max_disappeared = 8
min_confidence = 0.3
min_appearances = 3
use_point_cloud_voting = true
point_cloud_vote_threshold = 0.8
point_cloud_skip_frames = 5
point_cloud_history_len = 10
use_fix_size = true
fix_size_frames = 10
fix_size_dim_thresh = 0.4
kf_avg_frames = 10
floating_to_static_frames = 30
moving_speed_threshold = 0.35
voting_consistency_frames = 5

