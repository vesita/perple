stream_capacity = 1024
detections_capacity = 16
person_class_label = "person"
points_capacity = 16384
max_range = 10.0
min_range = 0.10

# 目标检测超参数配置
default_input_width = 640
default_input_height = 640
default_confidence_threshold = 0.6
default_nms_threshold = 0.7

# 模型路径
model_path = "model/quantized/yolo11n.onnx"

# 地面检测参数（直方图种子 + RANSAC 平面拟合生长）
ground_strategy = "peak_scan"  # 地面提取策略: "histogram", "histoseed", "ransac", "peak_scan", "gpf"
ground_expand = 0.10       # 地面种子区域 Z 向扩展量（米），peak_z ± expand 为初始地面区域
ground_ransac_distance = 0.3   # RANSAC 平面拟合内点距离阈值（米）
ground_ransac_iterations = 50  # RANSAC 迭代次数
upside_down = true         # 点云 Z 轴是否上下翻转（LiDAR 安装朝下时为 true）
has_ceiling = false        # 是否有天花板（配合 [cluster].ceiling_filter 使用）

# 墙体提取策略（用于追踪管线，bench 使用 config/bench/wall/*.toml）
wall_strategy = "bev_edlines"   # 墙体提取策略: bev_edlines / ransac_l2_grid / dbscan_l2_qt_dif / ...
wall_distance = 0.08         # RansacL2Grid 距离阈值
wall_iterations = 50         # RansacL2Grid RANSAC 迭代次数
wall_max_walls = 30          # 最大墙体平面数（RansacL2Grid 每帧保留的墙面数上限）
wall_eps = 0.20              # DbscanL2QtDif BFS 合并距离
wall_min_pts = 16            # DbscanL2QtDif 叶节点最小点数（密度中心门槛）
wall_min_z_span = 1.0        # 墙面最小 Z 跨度

# 点云聚类参数
[cluster]
# 聚类策略: "dbscan"（固定eps）, "dbscan_adaptive"（eps随距离线性增长）, "range_image"
strategy = "dbscan_qt"
# 基础邻域半径 eps（米），自适应模式下为 eps 截距；eps(p) = merge_patience + eps_slope * range(p)
merge_patience = 0.10
# 体素下采样格子大小（米），0 表示不下采样
voxel_size = 0.10
# DBSCAN 核心点最少邻居数，低于此数的点被视为噪声
min_points_per_cluster = 5
# 自适应 eps 斜率，值越大远处邻域半径越大；设为 0 则退化为固定 eps 模式
eps_slope = 0.05
# 四叉树节点最大点数，超过则分裂（空间索引加速邻域查询）
max_points_per_node = 50
# 四叉树最大深度
max_tree_depth = 10
# 下采样方法: "voxel"（均匀体素） 或 "gaussian"（距离概率采样，近密远疏）
downsample_method = "voxel"
# Gaussian 下采样 σ 值（米），keep_prob = exp(-d²/2σ²)；σ 越大远处保留越多
# 6m 处保留约 60%，12m 处保留约 14%
gaussian_downsample_rate = 6.0
# 聚类输入最大距离（米），超过此距离的非地面点被剔除；0 = 不限制
max_range = 10.0
# 天花板过滤：剔除 Z > ceiling_height 的点，减少天花板附近杂点产生的无效簇
ceiling_filter = true
ceiling_height = 2.5
# 框架级降噪：聚类前半径离群点剔除（替代策略内部噪声过滤）
denoise_radius = 0.20
denoise_min_pts = 3
# 密度感知质心加权：用 1/r^α 补偿 LiDAR 近密远疏导致的质心偏向传感器偏差
# 0 = 禁用（算术平均），1 = 1/r 补偿，2 = 1/r² 补偿
density_weight_alpha = 2.0

# Range image 策略参数（仅 strategy="range_image" 时有效）
azimuth_resolution = 2.0   # 方位角分辨率（度）
elevation_resolution = 2.0 # 俯仰角分辨率（度）
cluster_threshold = 1.0    # 相邻像素深度差阈值（米），超过则视为不同簇

[tracker]
# 目标连续未匹配帧数超过此值则永久删除轨迹
max_disappeared = 12
# 聚类结果置信度低于此值的检测被过滤，不参与匹配
min_confidence = 0.5
# 轨迹累计出现次数低于此值不输出（过滤一次性噪声目标）
min_appearances = 2
# 点云投票开关：通过对比历史点云位移判断目标是否真正在运动
use_point_cloud_voting = true
# 点云投票阈值：超过此比例的点发生位移则判定为运动
point_cloud_vote_threshold = 0.8
# 点云投票回溯帧数：对比当前帧与 N 帧前的点云
point_cloud_skip_frames = 5
# 点云投票位移阈值(m)：位移幅度超过此值才计为运动票，排除抖动噪声
point_vel_threshold = 0.08
# 每个轨迹保留的点云历史帧数上限
point_cloud_history_len = 10
# 箱体尺寸锁定开关：稳定跟踪后冻结尺寸，抑制抖动
use_fix_size = true
# 出现帧数超过此值后才启用尺寸锁定（避免初始阶段误锁）
fix_size_frames = 10
# 尺寸变化率阈值：三维尺寸变化率均低于此值则冻结，否则更新参考
fix_size_dim_thresh = 0.4
# Kalman 滤波器平滑窗口：用最近 K 帧的位置均值修正状态
kf_avg_frames = 5
# 漂浮→静态 回归所需连续帧数（在静态簇中持续 N 帧才确认为静态）
floating_to_static_frames = 30
# 运动速度阈值（m/s）：自运动补偿后速度高于此值判定为 Moving，低于为 Movable
moving_speed_threshold = 0.35
# 点云投票连续确认帧数：连续 N 帧投票通过才触发 Floating → Moving 转换
voting_consistency_frames = 5

# 帧间平滑：质心 1€ 低通滤波（静止强平滑，运动低延迟）
use_centroid_smoothing = true
# 最小截止频率（Hz），越低平滑越强
centroid_fc_min = 0.5
# 速度自适应系数，越大运动时延迟越低
centroid_beta = 1.0
# 箱体尺寸 EMA 平滑（替代 fix_size 硬锁定）
use_box_smoothing = true
# EMA 系数（0-1），越大跟踪越快；0=自适应置信度
box_smoothing_alpha = 0.25
# 速度 EMA 系数（0-1）；0=自适应置信度
vel_smoothing_alpha = 0.25
# 分类转换冷却帧数（Moving↔Movable 迟滞）
class_cooldown_frames = 15

# 航迹分级管理
confirmation_frames = 5        # Tentative→Confirmed 所需连续匹配帧数
tentative_max_missed = 3       # Tentative 轨迹最大丢失帧数（之后立即删除）

# Track Score（代替纯阈值生灭）
track_score_match_bonus = 3.0       # 匹配一次加分
track_score_miss_penalty = 1.5      # 丢失一次扣分
track_score_confirm_threshold = 5.0 # score ≥ 此值 → Tentative→Confirmed
track_score_delete_threshold = 0.0  # score ≤ 此值 + 超时 → 删除
track_score_output_threshold = 2.0  # score < 此值 → 不输出
track_score_max = 20.0              # score 上限

