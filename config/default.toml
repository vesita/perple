stream_capacity = 1024
detections_capacity = 16
person_class_label = "person"
points_capacity = 16384
resolution = 0.07

# 目标检测超参数配置
default_input_width = 640
default_input_height = 640
default_confidence_threshold = 0.6
default_nms_threshold = 0.7

# 模型路径
model_path = "module/color/yolo11n.onnx"

# DBSCAN聚类算法参数
dbscan_min_points = 3
# dbscan_eps会基于resolution动态计算，值为resolution * 4.0

# 地面检测参数（直方图种子 + RANSAC 平面拟合生长）
ground_expand = 0.20
ground_ransac_distance = 0.3
ground_ransac_iterations = 100
upside_down = true
has_ceiling = false

# 点云聚类参数
[claster]
# 聚类策略: "dbscan", "dbscan_adaptive", "range_image"
strategy = "dbscan_adaptive"
merge_patience = 0.20
merge_threshold = 0.6
voxel_size = 0.1
min_points_per_cluster = 8
eps_slope = 0.03
max_points_per_node = 50
max_tree_depth = 10
use_parallel = true
# 下采样方法: "voxel" 或 "gaussian"
downsample_method = "voxel"
# Gaussian 概率下采样参数（仅 downsample_method="gaussian" 时有效）
gaussian_downsample_rate = 6.0

# Range image 参数
azimuth_resolution = 2.0
elevation_resolution = 2.0
cluster_threshold = 1.0

[camera]
intrinsic = [
