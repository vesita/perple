# 示例增量配置文件
# 只更新需要更改的配置项

# 更新模型路径
model_path = "./module/color/yolo11s.onnx"

# 更新DBSCAN聚类参数
dbscan_min_points = 5

# 更新点云聚类参数
[cluster]
merge_patience = 0.15
voxel_size = 0.05

# 更新相机内参矩阵
[camera]
intrinsic = [[650.0, 0.0, 320.0], [0.0, 650.0, 240.0], [0.0, 0.0, 1.0]]
extrinsic = [
  0.538235, -0.835391,  0.111468,   -0.633395,
  0.422900, 0.153301,   -0.893115,  -0.120032,
  0.729012, 0.527846,   0.435799,   0.067773,
]
